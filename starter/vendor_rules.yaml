  - {pattern: '\bGEICO\b', vendor: GEICO, category: Transport, subcategory: Car Insurance}
  - {pattern: '\bPROGRESSIVE INS(?:URANCE)?\b', vendor: Progressive, category: Transport, subcategory: Car Insurance}
  - {pattern: '\bSTATE FARM\b', vendor: State Farm, category: Insurance}
  - {pattern: '\bALLSTATE\b', vendor: Allstate, category: Insurance}
  - {pattern: '\bLIBERTY MUTUAL\b', vendor: Liberty Mutual, category: Insurance}
  - {pattern: '\bFARMERS INS(?:URANCE)?\b', vendor: Farmers Insurance, category: Insurance}

  # shipping
  - {pattern: '\bUPS STORE\b', vendor: The UPS Store, category: "Cash & Misc", subcategory: Services}
  - {pattern: '\bFEDEX\b', vendor: FedEx, category: "Cash & Misc", subcategory: Services}

  # fitness
  - {pattern: '\bPLANET FIT(?:NESS)?\b', vendor: Planet Fitness, category: Health, subcategory: Fitness}
  - {pattern: '\bANYTIME FITNESS\b', vendor: Anytime Fitness, category: Health, subcategory: Fitness}
  - {pattern: '\bORANGETHEORY\b', vendor: Orangetheory Fitness, category: Health, subcategory: Fitness}
  - {pattern: '\bCLASSPASS\b', vendor: ClassPass, category: Health, subcategory: Fitness}

  # pets
  - {pattern: '\bCHEWY\.COM\b', vendor: Chewy, category: Pets}
  - {pattern: '\bPETCO\b', vendor: Petco, category: Pets}
  - {pattern: '\bPETSMART\b', vendor: PetSmart, category: Pets}
  - {pattern: '\bROVER\.COM\b', vendor: Rover, category: Pets}
  - {pattern: '\bTRUPANION\b', vendor: Trupanion, category: Pets}

  # childcare and lessons
  - {pattern: '\bKINDERCARE\b', vendor: KinderCare, category: Kids, subcategory: Childcare}
  - {pattern: '\bBRIGHT HORIZONS\b', vendor: Bright Horizons, category: Kids, subcategory: Childcare}
  - {pattern: '\bKUMON\b', vendor: Kumon, category: Kids, subcategory: Activities}

  # stores that sell everything: a vendor and no category (Amazon alone is filed, under its own subcategory)
  - {pattern: '\bAMAZON(?:\.COM| MKTPL?| MKTPLACE| MARKETPLACE)\b', vendor: Amazon, category: Shopping, subcategory: Amazon}
  - {pattern: '^AMZN\b', vendor: Amazon, category: Shopping, subcategory: Amazon}
  - {pattern: '^EBAY\b', vendor: eBay}
  - {pattern: '^ETSY\b', vendor: Etsy}
  - {pattern: '\b(?:WALMART|WAL-MART)\b', vendor: Walmart}
  - {pattern: '\bWM SUPERCENTER\b', vendor: Walmart}
  - {pattern: '\bTARGET(?:\.COM| T- ?\d+)\b', vendor: Target}
  - {pattern: '\bCOSTCO\b', vendor: Costco}
  - {pattern: '\b(?:SAMS CLUB|SAMSCLUB|SAM''S CLUB)\b', vendor: "Sam's Club"}
  - {pattern: '\bDOLLAR[ -]?GENERAL\b', vendor: Dollar General}
  - {pattern: '\bDOLLAR ?TREE\b', vendor: Dollar Tree}
  - {pattern: '\bFAMILY DOLLAR\b', vendor: Family Dollar}
  - {pattern: '\b7-?ELEVEN\b', vendor: 7-Eleven}
  - {pattern: '\bCIRCLE K\b', vendor: Circle K}

# Vendors whose review answers are never turned into a learned rule (a payment app, a store that sells everything).
learning:
  exclude: [Amazon, eBay, Etsy, Walmart, Target, Costco, "Sam's Club", Dollar General, Dollar Tree, Family Dollar,
            7-Eleven, Circle K]

# Vendor renames: `- {from: Old Name, to: New Name}` re-spells a vendor everywhere it is stored when the config
# loads; the files themselves are never rewritten.
renames: []
