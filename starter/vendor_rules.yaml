# Vendor rules: how a raw bank descriptor becomes a vendor name. The engine tries each prefix below once, in order, on
# what is left (so several can strip in turn, a later one after an earlier one), removes the cleanup patterns, then
# tries the vendor patterns in order; when none matches, the vendor is the first four words of what is left,
# title-cased with the acronyms kept upper case. Every entry below is a regular expression, matched with case ignored
# (single quotes keep its backslashes as written).

# Payment processors and marketplaces that print their own tag before the shop's name: removed from the start.
strip_prefixes:
  - '^SQ ?\*\s*'              # Square
  - '^TST ?\*\s*'             # Toast
  - '^SP\s+(?:\*\s*)?'        # Shopify
  - '^PAYPAL ?\*\s*'          # PayPal
  - '^PP ?\*\s*'              # PayPal
  - '^IN \*\s*'               # Intuit QuickBooks payments
  - '^EB \*\s*'               # Eventbrite
  - '^FS \*\s*'               # FastSpring

# Removed wherever it appears (each match becomes a space), in this order and after the engine's own format-neutral
# cleanup. Bank and card metadata comes first, so the number and date patterns below never part a metadata label
# from its value. Add a pattern for any noise your bank's export format adds.
cleanup:
  # ACH metadata in large US banks' export formats: an entry class code with the originator's id, a company id,
  # the entry description, the individual's name; and a debit-card code with its number
  - '\b(?:PPD|WEB|CCD|ARC|TEL) ID:?\s*\S+'
  - '\bCO ID:?\s*\S+'
  - '\bDES:[A-Z ]+\b'
  - '\bINDN:[\w .]+?(?=\bCO\b|$)'
  - '\bCKCD \d+'
  - '\bRECURRING\b'                                                    # the card network's recurring-payment flag
  - '\bX{4,}\d{2,4}\b'                                                  # a masked card or account number
  - '\bCARD\s+\d{4}\b'                                                  # a card's last four digits
  - '(?:\+?1[-. ]?)?(?:\(\d{3}\)\s?|\b\d{3}[-. ])\d{3}[-. ]\d{4}\b'    # a US phone number
  - '#\s*\d+'                                                           # a store number
  - '\+?\b\d{5,}\b'                                                     # a long digit run: reference, ZIP or phone
  - '\b\d{1,2}/\d{1,2}(?:/\d{2,4})?\s*$'                               # a trailing date

# Words kept upper case when a vendor name is made from the descriptor, in addition to the engine's own list (ATM,
# LLC, USA and other national ones). Add a local chain or a state abbreviation that should not read as a word.
acronyms: [ACH, CPA, DDS, LLP]

# Vendor patterns, tried in order; the first whose pattern matches the cleaned descriptor names the vendor, and a
# `category:` (with an optional `subcategory:`) files every row of that vendor, ahead of the keyword rules:
#   - {pattern: '\bACME COFFEE\b', vendor: Acme Coffee, category: Dining, subcategory: Coffee}
# Anchor short or common-word patterns: a pattern that also matches a neighbour files that neighbour wrongly.
#
# The list below names national US merchants the way card networks print them. A pattern sees the descriptor after
# the prefixes and cleanup above, in upper case: store numbers, phone numbers and long digit runs are already gone.
# Each pattern holds a run of at least five letters or starts at the beginning of the descriptor (`^`), and ends at a
# word boundary, so a neighbour's name, or the merchant's word inside another word, reaches no pattern. A name that is
# also an ordinary word (Shell, Delta, Target) matches only with a second token that makes it the merchant, and a
# longer name comes before a name it contains; a name that is also a person's name (Marriott, Nordstrom, Orkin)
# starts the descriptor, so a payment to a person never matches. A store whose baskets span several categories
# (a warehouse club, a big-box or convenience store, a marketplace) names its vendor and files nothing: its rows take
# the card issuer's label, else the fallback, and its name is in `learning.exclude` below; Amazon is filed under its
# own subcategory of Shopping and is excluded from learning all the same. Delete the merchants you never use, and add
# your local ones.
patterns:
  # groceries
  - {pattern: '\b(?:WHOLEFDS|WHOLE FOODS)\b', vendor: Whole Foods Market, category: Groceries}
  - {pattern: '\bTRADER JOE''?S?\b', vendor: "Trader Joe's", category: Groceries}
  - {pattern: '^ALDI\b', vendor: ALDI, category: Groceries}
  - {pattern: '\bINSTACART\b', vendor: Instacart, category: Groceries}
  - {pattern: '\bTHRIVE MARKET\b', vendor: Thrive Market, category: Groceries}
  - {pattern: '\bHELLO ?FRESH\b', vendor: HelloFresh, category: Groceries}

