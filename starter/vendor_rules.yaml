  - {pattern: '\bPOPEYES\b', vendor: Popeyes, category: Dining, subcategory: Restaurants}
  - {pattern: '\b(?:ARBYS|ARBY''S)\b', vendor: "Arby's", category: Dining, subcategory: Restaurants}
