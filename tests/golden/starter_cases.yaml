# Golden cases for the starter rule files (tests/test_golden_categorize.py). Every descriptor is invented and printed
# the way card networks print national merchants: upper case, store numbers, a 555 phone number, a city and state, a
# processor's prefix. `kind` is the account kind the row is on (default credit-card) and `amount` is in dollars
